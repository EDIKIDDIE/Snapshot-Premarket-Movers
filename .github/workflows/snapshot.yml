name: Take and Email Snapshot

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install shot-scraper and browsers
        run: |
          pip install shot-scraper
          shot-scraper install

      - name: Take snapshot
        run: |
          shot-scraper multi shots.yml

      - name: Send email via Python
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          python -c "
          import os
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication

          sender = os.environ['MAIL_USERNAME']
          password = os.environ['MAIL_PASSWORD']
          
          msg = MIMEMultipart()
          msg['Subject'] = 'Automated Web Snapshot'
          msg['From'] = sender
          msg['To'] = sender

          msg.attach(MIMEText('Here is your scheduled webpage snapshot.'))

          with open('snapshot.png', 'rb') as f:
              attach = MIMEApplication(f.read(), Name='snapshot.png')
              attach.add_header('Content-Disposition', 'attachment', filename='snapshot.png')
              msg.attach(attach)

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(sender, password)
              server.send_message(msg)
          print('Email sent successfully!')
          "
